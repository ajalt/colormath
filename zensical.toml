[project]
site_name = "Colormath"
site_description = "Colormath: Multiplatform color space conversions for Kotlin"
site_author = "AJ Alt"
copyright = "Copyright &copy; 2021 AJ Alt"
repo_url = "https://github.com/ajalt/colormath"
repo_name = "Colormath"

extra_css = ["css/extra.css"]

nav = [
  { "Getting Started" = "index.md" },
  { "Usage" = "usage.md" },
  { "Color Spaces" = "colorspaces.md" },
  { "Extensions" = "extensions.md" },
  { "Try It Online" = "tryit/index.html" },
  { "API Reference" = "api/colormath/com.github.ajalt.colormath/index.html" },
  { "Releases" = "changelog.md" },
]

[project.theme]
logo = "img/palette_white_24dp.svg"
favicon = "img/favicon.ico"
icon.repo = "fontawesome/brands/github"

[project.theme.palette]
scheme = "slate"
primary = "deep purple"
accent = "purple"

[project.markdown_extensions]
smarty = {}
codehilite.guess_lang = false
footnotes = {}
meta = {}
toc.permalink = true
pymdownx.betterem.smart_enable = "all"
pymdownx.caret = {}
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed = {}
tables = {}
admonition = {}
md_in_html = {}
attr_list = {}
